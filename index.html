<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Jersey+25&display=swap" rel="stylesheet" />
  <link href="styles.css" rel="stylesheet" />
</head>

<body>
  <div class="video-game-container">
    <div class="screen-container">
      <h1>Battle Simulator</h1>
      <div class="main-container">
        <div class="player-container">
          <div class="player-one player"></div>
          <hr />
          <div class="player-two player">
            <h2>Player Two</h2>
          </div>
        </div>
      </div>
      <div id="battle-log"></div>
    </div>
    <div class="game-title">gameboy simulator</div>
    <div class="button-container">
      <button class="js-start-button js-button">Start</button>
      <button class="js-attack-button js-button">Attack</button>
      <button class="js-defend-button js-button">Defend</button>
      <button class="js-magic-button js-button">Magic</button>
      <button class="js-persuade-button js-button">Persuade</button>
      <button class="js-evade-button js-button">Evade</button>


      <button class="js-restart">Restart</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
